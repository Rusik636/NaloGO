default_language_version:
  python: python3.11

# Версии хуков держим совпадающими с requirements-dev.txt, иначе локальная
# проверка и CI будут расходиться в вердиктах.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      # ловит .pyc и .coverage, которые уже однажды попали в репозиторий
      - id: check-added-large-files
        args: [--maxkb=512]
      # шебанг с CRLF делает хук неисполняемым — эта проверка её отлавливает
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^nalogo/
        additional_dependencies:
          - httpx
          - pydantic>=2.0.0
          - python-dotenv

  # Заменяет самописный .git/hooks/pre-commit, который срабатывал на любое
  # вхождение слов token/key/password, включая "keyword" и строки контекста.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
