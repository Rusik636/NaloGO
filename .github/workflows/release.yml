name: Release to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run full test suite
      run: |
        echo "🧪 Running full test suite before release..."
                  pytest tests/ -v --cov=nalogo --cov-report=term-missing

    - name: Lint and format check
      run: |
        echo "🔍 Running lint and format checks..."
        ruff check .
        black --check .

    - name: Type check
      run: |
        echo "🔎 Running type checks..."
        mypy nalogo/

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build source distribution and wheel
      run: |
        echo "📦 Building source distribution and wheel..."
        python -m build

    - name: Verify package
      run: |
        echo "🔍 Verifying package integrity..."
        twine check dist/*

    - name: Upload build artifacts
      uses: actions/upload-artifact@v5
      with:
        name: release-packages
        path: dist/

  release-test-pypi:
    name: Release to Test PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch'

    # Trusted Publishing: PyPI доверяет этому workflow по OIDC-токену,
    # секреты с API-токенами не нужны. Настраивается на стороне PyPI,
    # в разделе Publishing проекта.
    environment:
      name: testpypi
      url: https://test.pypi.org/project/nalogo/
    permissions:
      id-token: write

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v5
      with:
        name: release-packages
        path: dist/

    - name: Publish to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        # тестовый индекс перезаливают часто: повторный прогон с той же
        # версией не должен валить workflow. Для боевого PyPI оставлено
        # значение по умолчанию (false) - там молчаливый пропуск опасен
        skip-existing: true

  release-pypi:
    name: Release to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pypi
      url: https://pypi.org/project/nalogo/
    permissions:
      id-token: write   # OIDC-токен для Trusted Publishing
      contents: write   # создание GitHub Release

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v5
      with:
        name: release-packages
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

    # actions/create-release@v1 заархивирован и работает на Node 12,
    # который GitHub-раннеры больше не запускают. gh идёт в образе раннера.
    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        version="${GITHUB_REF_NAME#v}"   # тег v1.1.0 -> версия пакета 1.1.0
        # --repo обязателен: job не делает checkout, git-репозитория в
        # рабочем каталоге нет, и gh не смог бы определить репозиторий сам
        gh release create "${{ github.ref_name }}" dist/* \
          --repo "${{ github.repository }}" \
          --title "Release ${{ github.ref_name }}" \
          --notes "Изменения — в [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

        Установка:
        \`\`\`bash
        pip install nalogo==$version
        \`\`\`"
